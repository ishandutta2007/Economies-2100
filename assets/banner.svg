<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".01"/></linearGradient><linearGradient id="lineGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient><linearGradient id="lineGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="lineGrad3" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#fb7185"/></linearGradient><linearGradient id="lineGrad4" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="orbGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="40"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.15)}}@keyframes floatOrb{0%{transform:translate(0,0)}50%{transform:translate(-30px,20px)}}@keyframes waveFloat{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes badgePulse{0%{transform:translateY(0);filter:drop-shadow(0 0 2px rgba(56,189,248,.2))}50%{transform:translateY(-3px);filter:drop-shadow(0 0 8px rgba(56,189,248,.5))}}.bg-grid{stroke:#334155;stroke-opacity:.25;stroke-width:1}.animated-dash{stroke-dasharray:6 6;animation:dashMove 15s linear infinite}.orb-1{animation:pulseGlow 8s ease-in-out infinite,floatOrb 12s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseGlow 10s ease-in-out infinite reverse;transform-origin:1000px 300px}.chart-wave{animation:waveFloat 6s ease-in-out infinite}.pill-badge{animation:badgePulse 4s ease-in-out infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><circle cx="180" cy="90" r="130" fill="#38bdf8" class="orb-1" filter="url(#orbGlow)" opacity=".18"/><circle cx="1020" cy="310" r="150" fill="#818cf8" class="orb-2" filter="url(#orbGlow)" opacity=".18"/><circle cx="600" cy="210" r="180" fill="#c084fc" filter="url(#orbGlow)" opacity=".08"/><g class="bg-grid"><line x1="80" x2="80" y1="40" y2="380"/><line x1="200" x2="200" y1="40" y2="380"/><line x1="320" x2="320" y1="40" y2="380"/><line x1="440" x2="440" y1="40" y2="380"/><line x1="560" x2="560" y1="40" y2="380"/><line x1="680" x2="680" y1="40" y2="380"/><line x1="800" x2="800" y1="40" y2="380"/><line x1="920" x2="920" y1="40" y2="380"/><line x1="1040" x2="1040" y1="40" y2="380"/><line x1="1120" x2="1120" y1="40" y2="380"/><line x1="60" x2="1140" y1="80" y2="80"/><line x1="60" x2="1140" y1="160" y2="160"/><line x1="60" x2="1140" y1="240" y2="240"/><line x1="60" x2="1140" y1="320" y2="320"/></g><g class="chart-wave" opacity=".65"><path fill="none" stroke="url(#lineGrad1)" stroke-width="3" d="M 60 330 C 350 310, 750 250, 1140 130" filter="url(#glow)"/><path fill="none" stroke="url(#lineGrad2)" stroke-width="2.5" d="M 60 365 C 400 355, 780 280, 1140 180" class="animated-dash"/><path fill="none" stroke="url(#lineGrad3)" stroke-width="2" d="M 60 350 C 450 340, 800 295, 1140 220" opacity=".8"/><path fill="none" stroke="url(#lineGrad4)" s