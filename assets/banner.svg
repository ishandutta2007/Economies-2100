<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01" />
    </linearGradient>

    <!-- Curve gradients -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="lineGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Area Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <style>
      .bg-grid { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
      
      /* Dynamic animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-30px, 20px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes badgePulse {
        0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(56,189,248,0.2)); }
        50% { transform: translateY(-3px); filter: drop-shadow(0 0 8px rgba(56,189,248,0.5)); }
      }

      .animated-dash {
        stroke-dasharray: 6 6;
        animation: dashMove 15s linear infinite;
      }
      .orb-1 {
        animation: pulseGlow 8s ease-in-out infinite, floatOrb 12s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .orb-2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: 1000px 300px;
      }
      .chart-wave {
        animation: waveFloat 6s ease-in-out infinite;
      }
      .pill-badge {
        animation: badgePulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Glowing Background Orbs (Behind everything) -->
  <circle class="orb-1" cx="180" cy="90" r="130" fill="#38bdf8" opacity="0.18" filter="url(#orbGlow)" />
  <circle class="orb-2" cx="1020" cy="310" r="150" fill="#818cf8" opacity="0.18" filter="url(#orbGlow)" />
  <circle cx="600" cy="210" r="180" fill="#c084fc" opacity="0.08" filter="url(#orbGlow)" />

  <!-- Isometric / Perspective Grid Pattern -->
  <g class="bg-grid">
    <line x1="80" y1="40" x2="80" y2="380" />
    <line x1="200" y1="40" x2="200" y2="380" />
    <line x1="320" y1="40" x2="320" y2="380" />
    <line x1="440" y1="40" x2="440" y2="380" />
    <line x1="560" y1="40" x2="560" y2="380" />
    <line x1="680" y1="40" x2="680" y2="380" />
    <line x1="800" y1="40" x2="800" y2="380" />
    <line x1="920" y1="40" x2="920" y2="380" />
    <line x1="1040" y1="40" x2="1040" y2="380" />
    <line x1="1120" y1="40" x2="1120" y2="380" />

    <line x1="60" y1="80" x2="1140" y2="80" />
    <line x1="60" y1="160" x2="1140" y2="160" />
    <line x1="60" y1="240" x2="1140" y2="240" />
    <line x1="60" y1="320" x2="1140" y2="320" />
  </g>

  <!-- Dynamic Solow Convergence Growth Trajectories (Background Graph) -->
  <g class="chart-wave" opacity="0.65">
    <!-- Curve 1: Frontier / US Trajectory -->
    <path d="M 60 330 C 350 310, 750 250, 1140 130" fill="none" stroke="url(#lineGrad1)" stroke-width="3" filter="url(#glow)" />
    <!-- Curve 2: Asian Rapid Convergence (Catch-up curve) -->
    <path class="animated-dash" d="M 60 365 C 400 355, 780 280, 1140 180" fill="none" stroke="url(#lineGrad2)" stroke-width="2.5" />
    <!-- Curve 3: Middle-income convergence -->
    <path d="M 60 350 C 450 340, 800 295, 1140 220" fill="none" stroke="url(#lineGrad3)" stroke-width="2" opacity="0.8" />
    <!-- Curve 4: Emerging / Frontier -->
    <path d="M 60 375 C 500 370, 820 330, 1140 270" fill="none" stroke="url(#lineGrad4)" stroke-width="2" opacity="0.7" />

    <!-- Trajectory endpoint pulses -->
    <circle cx="1140" cy="130" r="5" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="180" r="4.5" fill="#34d399" filter="url(#glow)">
      <animate attributeName="r" values="3.5;6.5;3.5" dur="2.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="220" r="4" fill="#fb7185">
      <animate attributeName="r" values="3;5.5;3" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Vignette / Readability Backdrop to ensure foreground text crispness -->
  <rect x="70" y="55" width="1060" height="310" rx="14" fill="#090d16" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.5" />

  <!-- Decorative Top Bar -->
  <path d="M 70 69 Q 70 55 84 55 L 1116 55 Q 1130 55 1130 69 L 1130 62 L 70 62 Z" fill="url(#titleGrad)" opacity="0.9" />

  <!-- Floating Feature Badges / Pills (Dynamic Animated Aspect) -->
  <g class="pill-badge" transform="translate(110, 85)">
    <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="14" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">2026 – 2100 HORIZON</text>
  </g>

  <g class="pill-badge" transform="translate(305, 85)" style="animation-delay: 1s;">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="14" r="4.5" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">SOLOW CONVERGENCE</text>
  </g>

  <g class="pill-badge" transform="translate(530, 85)" style="animation-delay: 2s;">
    <rect width="220" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="14" r="4.5" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">16 MEGA-POPULATION NATIONS</text>
  </g>

  <!-- Foreground Content: Unobscured Header & Subtitle -->
  <g transform="translate(110, 175)">
    <!-- Main Title -->
    <text x="0" y="0" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      ECONOMIES-2100
    </text>
    
    <!-- Subtitle / Hook -->
    <text x="0" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2">
      Long-Term GDP per Capita Projections (2026–2100)
    </text>

    <!-- Tagline Description -->
    <text x="0" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" line-height="1.5">
      Conditional Neoclassical Solow Convergence Simulation for All Countries with Population &gt; 100 Million
    </text>
    <text x="0" y="105" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Calibrated with IMF World Economic Outlook &amp; UN Population Division Projections
    </text>
  </g>

  <!-- Bottom Dynamic Status Indicators inside card -->
  <g transform="translate(110, 325)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">★ FRONTIER TARGET</text>
      <text x="0" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">United States ($263.7K)</text>
    </g>
    <g transform="translate(250, 0)">
      <text x="0" y="0" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">▲ HIGHEST CATCH-UP</text>
      <text x="0" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">India (5.06% CAGR, 39x)</text>
    </g>
    <g transform="translate(500, 0)">
      <text x="0" y="0" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700">◆ SE ASIA SURGE</text>
      <text x="0" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Vietnam ($119K) &amp; Indonesia ($103K)</text>
    </g>
    <g transform="translate(770, 0)">
      <text x="0" y="0" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">● METHODOLOGY</text>
      <text x="0" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Nonlinear Structural λ-Decay</text>
    </g>
  </g>
</svg>
